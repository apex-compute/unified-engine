  - pip:
      # EDIT 1 of 3 vs. a raw `pip list` dump: torch/torchvision/torchaudio resolved
      # as +cpu local-version wheels, which only exist on PyTorch's own index. Without
      # this line the pins below are unsatisfiable.
      - --extra-index-url https://download.pytorch.org/whl/cpu

      # ---- unified-engine base (CPU wheels; the model runs on the FPGA) ----------
      - torch==2.7.1+cpu
      - torchvision==0.22.1+cpu
      - torchaudio==2.7.1+cpu
      # numpy<2 is the pin the whole file hangs off: robosuite/gym 0.25 break on 2.x,
      # and it is what lets the simulator and user_dma_core share one interpreter.
      - numpy==1.26.4
      - transformers==4.57.6
      - tokenizers==0.22.2
