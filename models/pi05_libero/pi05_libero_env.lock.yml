      # EDIT 2 of 3: `pip list` reports this as a flat `libero==0.1.0`. Installing it
      # that way is the exact failure the spec documents at length -- LIBERO is a
      # PEP 420 namespace package with no libero/__init__.py, so find_packages()
      # returns [] and pip cheerfully installs a ~5.5 KB metadata-only wheel. Plain
      # `-e` (PEP 660) fails the same way with MAPPING = {}. Only
      # editable_mode=compat works, via the legacy .pth mechanism.
      # There is no commit pin here because upstream publishes no tags; if you need
      # true reproducibility, append @<sha> to the URL.
      # ALWAYS verify with: python -c "import libero.libero"
      - -e git+https://github.com/Lifelong-Robot-Learning/LIBERO.git#egg=libero --config-settings editable_mode=compat

# EDIT 3 of 3: packaging, pip, setuptools and wheel appear in BOTH `pip list` and the
# conda section above. They are listed only under conda here -- pinning them in both
# places lets pip fight conda over the same files on env creation.
