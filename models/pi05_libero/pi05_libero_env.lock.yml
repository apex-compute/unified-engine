# EXACT RESOLVED ENVIRONMENT for pi05_libero -- a LOCKFILE, not a spec.
#
# Its companion is pi05_libero_env.yml, and the two have different jobs:
#
#   pi05_libero_env.yml       WHAT to install and WHY. Loose where loose is safe,
#                             pinned only where a pin is load-bearing, and heavily
#                             commented. EDIT THAT FILE when you change a dependency.
#   pi05_libero_env.lock.yml  WHAT actually resolved, on the machine where the env
#                             is known to work. Every direct AND transitive version
#                             pinned. NEVER hand-edit this; regenerate it.
#
# Use the lock when you need the env to come back byte-for-byte (another box, a
# rebuild after an upgrade broke something, or bisecting "it worked last week").
# Use the spec when you are adding or moving a dependency.
#
#   conda env create -f models/pi05_libero/pi05_libero_env.lock.yml
#   conda activate pi05_libero
#   bash models/pi05_libero/setup_env.sh --osmesa-only
#   printf 'N\n' | python -c "import libero.libero"
#
# THE TWO STEPS THIS FILE STILL CANNOT EXPRESS are the same two the spec calls out,
# and a lockfile does not make them go away:
#   1. libOSMesa is not on conda-forge. setup_env.sh downloads Ubuntu's libosmesa6
#      (no sudo) and drops libOSMesa.so.8 into $CONDA_PREFIX/lib.
#   2. Headless rendering needs MUJOCO_GL=osmesa, PYOPENGL_PLATFORM=osmesa and
#      LD_LIBRARY_PATH=$CONDA_PREFIX/lib exported at runtime.
#
# REGENERATE (from the repo root, with the env working):
#   conda env export -n pi05_libero        # conda section, with build strings
#   conda run -n pi05_libero pip list --format=freeze
# then re-apply the three edits noted inline below (libero, torch index, conda-owned
# packages). Those edits are why this is not a raw `conda env export` dump.
#
# Captured 2026-08-11 on linux-64, python 3.11.15, from a pi05_libero env that runs
# both the FPGA model and the LIBERO simulator in one process.
# -----------------------------------------------------------------------------

name: pi05_libero

channels:
  - conda-forge

