# Single conda env for pi05_libero: runs the FPGA model AND the LIBERO simulator in
# ONE process -- no socket, no server/client. CPU-only; no CUDA device required.
#
# ONE COMMAND does everything, including the two steps conda cannot express:
#
#   bash models/pi05_libero/setup_env.sh
#
# Or by hand, from the REPO ROOT (the LIBERO clone lands in ./src/libero):
#
#   conda env create -f models/pi05_libero/pi05_libero_env.yml
#   conda activate pi05_libero
#   bash models/pi05_libero/setup_env.sh --osmesa-only   # see "OSMesa" below
#   printf 'N\n' | python -c "import libero.libero"      # seed LIBERO's config prompt
#   python models/pi05_libero/pi05_libero_test.py        # downloads+exports weights once
#
# Headless rendering (libero_eval.py only) -- ALL THREE are required:
#   export MUJOCO_GL=osmesa PYOPENGL_PLATFORM=osmesa
#   export LD_LIBRARY_PATH=$CONDA_PREFIX/lib
#
# -----------------------------------------------------------------------------
# WHY THESE PINS -- all load-bearing, do not "upgrade" them casually:
#
#  numpy<2      robosuite/gym 0.25 break on numpy 2.x. This is what lets the sim and
#               user_dma_core coexist in ONE interpreter. It also constrains the jax
#               stack below, which is why those are pinned to openpi's own versions.
#
#  jax 0.5.3 +  Needed ONLY for the one-time weight export (orbax checkpoint ->
#  orbax        weights_export/*.npy). This exact set is what upstream openpi pins,
#  0.11.13      so it is known-good together AND known-good with numpy<2. CPU jax is
#               correct here: the export just reads arrays off disk. ml-dtypes and
#               tensorstore are openpi's own resolution overrides -- orbax is picky
#               about both, so they are pinned rather than left to the resolver.
#
#  torch CPU    The model runs on the FPGA, not a GPU, so CPU torch is the right
#               build. The pure-torch reference (pi05_torch_ref.py, --verify-denoise,
#               libero_eval.py --backend torch) still works, just slowly. If you ever
#               DO have a CUDA box, swap the index-url to the matching cuXXX and keep
#               torch at 2.7.1 so nothing else in here has to move.
#               NOTE torch >= 2.6 defaults torch.load(weights_only=True), which
#               REJECTS LIBERO's pickled-numpy init-state files. libero_eval.py
#               installs a scoped shim for that; standalone scripts need their own.
#
#  mesalib      GL/GLX/EGL userspace + llvmpipe software rasterizer. It does NOT
#               ship libOSMesa (dropped by conda-forge; verified absent in both
#               25.2.8 and 26.1.6, and there is no standalone `osmesa` package).
#               See "OSMesa" below -- that library has to come from elsewhere.
#
# OSMesa -- THE ONE THING CONDA CANNOT INSTALL
#   MuJoCo's own Renderer can do surfaceless EGL, but robosuite goes through
#   EGLGLContext, which needs the EGL PLATFORM_DEVICE extension and therefore
#   /dev/dri. On a box where you are not in the `render`/`video` groups that is
#   denied, and no amount of LIBGL_ALWAYS_SOFTWARE helps -- so OSMesa is the only
#   working headless path, and libOSMesa is not on conda-forge. setup_env.sh pulls
#   Ubuntu's libosmesa6 with `apt-get download` (NO sudo, it is a plain download),
#   extracts it, and drops libOSMesa.so.8 into $CONDA_PREFIX/lib. It has no missing
#   transitive deps.
#   If you DO have a usable render node, skip it and use MUJOCO_GL=egl instead.
#
# openpi is deliberately ABSENT. It is only ever needed for the one-time weight
# export, and pi05_ckpt_noopenpi.py reproduces the only two things the export used
# it for (a public-bucket download + an orbax restore) using the jax/orbax below.
# That avoids openpi's jax[cuda12] + lerobot + wandb tree entirely. Nothing here
# imports openpi; `openpi-client` below is a DIFFERENT, real package (the websocket
# policy client) that libero_eval.py uses for `image_tools`.
# -----------------------------------------------------------------------------

name: pi05_libero

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  # GL userspace + software rasterizer. NOT a source of libOSMesa -- see above.
  - mesalib
  - libglu

  - pip:
      # ---- unified-engine base (mirrors ../../requirements.txt, CPU wheels) ----
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.7.1
      - torchvision==0.22.1
      - torchaudio==2.7.1
      - soundfile
      - numpy<2
      - transformers>=4.40,<5
      - huggingface-hub>=0.20.0
      - pillow>=12.1.1
      - sentencepiece

      # ---- one-time weight export (openpi-free path) ----
      - jax==0.5.3
      - jaxlib==0.5.3
      - flax==0.10.2
      - orbax-checkpoint==0.11.13
      - ml-dtypes==0.4.1
      - tensorstore==0.1.74

      # ---- LIBERO simulator (robosuite/mujoco) + runtime deps ----
      - robosuite==1.4.1
      - mujoco==3.2.3
      - bddl==1.0.1
      - gym==0.25.2
      - opencv-python
      - imageio
      - imageio-ffmpeg
      - tyro
      - numba
      - scipy
      - easydict
      - future
      - matplotlib
      - einops
      - cloudpickle
      - PyOpenGL
      - openpi-client          # libero_eval.py: `from openpi_client import image_tools`

      # ---- LIBERO itself (scenes/BDDL/benchmark API) ----
      # MUST be `-e` WITH `editable_mode=compat`. Both halves are load-bearing:
      #
      #   plain `libero @ git+...`  -> pip reports success and installs a ~5.5 KB
      #     METADATA-ONLY wheel. LIBERO has no libero/__init__.py (it is a PEP 420
      #     namespace package), so its setup.py's find_packages() returns []. The
      #     failure surfaces much later as `ModuleNotFoundError: No module named
      #     'libero'`. This is what this line used to be.
      #
      #   plain `-e` (PEP 660)      -> ALSO broken, same root cause: the generated
      #     __editable___libero_finder.py has `MAPPING = {}`, so it resolves nothing.
      #
      #   `editable_mode=compat`    -> falls back to the legacy .pth mechanism, which
      #     puts the PROJECT ROOT on sys.path, and the namespace package then resolves.
      #
      # Verify with `python -c "import libero.libero"` -- never trust pip's message here.
      # setup.py has install_requires=[], so this pulls NO transitive deps and cannot
      # fight the pins above. (Its requirements.txt asks for numpy==1.22.4 /
      # robosuite==1.4.0 / transformers==4.21.1, but setup.py ignores that file -- and
      # so do we, the same way openpi does.)
      #
      # Clones to ./src/libero relative to your CWD, so run conda env create from the
      # repo root. ~405 MB of scene assets, plain files, no git-lfs.
      - -e git+https://github.com/Lifelong-Robot-Learning/LIBERO.git#egg=libero --config-settings editable_mode=compat
