name: Clean Model Bin Dirs

# Manually triggerable from the Actions tab. Deletes entire models/*/*_bin
# directories (weights, HF cache, and compiled programs) for every model.
# More aggressive than "Clean Program Bins" — the next run redownloads
# weights from scratch, not just recompiles.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without actually deleting"
        required: false
        type: boolean
        default: false

# The job only runs a script on p620 over SSH: no GITHUB_TOKEN access needed.
permissions: {}

concurrency:
  group: model-hw-ci
  cancel-in-progress: false  # never race with a live CI/HW run

jobs:
  clean:
    # bootcamp's runners; the caches are in p620's checkout, cleaned there over SSH.
    runs-on: [bootcamp, unified-engine]
    steps:
      - name: Clean model bin dirs on p620
        env:
          P620_SSH: ${{ vars.UE_KINTEX7_SSH || 'ue-p620' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARG=""
          [[ "$DRY_RUN" == "true" ]] && ARG=--dry-run
          ssh -o BatchMode=yes "$P620_SSH" \
            "cd \"\${UE_P620_DIR:-\$HOME/actions-runner/_work/unified-engine/unified-engine}\" && ./clean_model_bin_dirs.sh $ARG"
