name: Unified Engine Night Run

on:
  schedule:
    # 09:15 Pacific: after andromeda's PCIe Night Run (02:52, usually done by 08:00-09:00),
    # which also uses p2's U50 for its own hardware tests. The p2 hardware lock covers a
    # late andromeda night.
    - cron: "15 9 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    # The scheduled night uses these defaults: both boards, every core, the full registry.
    inputs:
      board:
        description: "kintex7 (p620), alveo_u50 (p2 xdma0) or both"
        required: false
        type: choice
        options: [both, kintex7, alveo_u50]
        default: both
      engines:
        description: "Model round engine count: max (every core the board reports) or 1..8"
        required: false
        type: string
        default: "max"
      models:
        description: "Registered model names, space-separated; empty runs the full registry"
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  run-model-ci:
    name: Run and collect full model CI
    runs-on: ubuntu-latest
    timeout-minutes: 310
    outputs:
      slack-message: ${{ steps.run.outputs.slack-message }}
    steps:
      - name: Dispatch full model CI and wait
        id: run
        uses: actions/github-script@v7
        with:
          script: |
            const workflowId = 'ci.yml';
            // Dispatch ci.yml on the ref THIS workflow was launched from, so picking a
            // branch in the Actions UI actually runs that branch's ci.yml + registry.
            // On a `schedule` event context.ref is the default branch, so the nightly
            // still targets main exactly as before.
            const branch = (context.ref || 'refs/heads/main').replace('refs/heads/', '');
            const common = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };
            const sleep = milliseconds =>
              new Promise(resolve => setTimeout(resolve, milliseconds));
            // A scheduled night carries no inputs: both boards, every core, full registry.
            const cfg = context.payload.inputs || {};
            const board = cfg.board || 'both';
            const engines = cfg.engines || 'max';
            const models = (cfg.models || '').trim();
            const boardText = {
              both: 'kintex7 (p620) + Alveo U50 (p2 xdma0)',
              kintex7: 'kintex7 (p620)',
              alveo_u50: 'Alveo U50 (p2 xdma0)',
            }[board] || board;

            const before = await github.rest.actions.listWorkflowRuns({
              ...common,
              workflow_id: workflowId,
              branch,
              event: 'workflow_dispatch',
              per_page: 100,
            });
            const existingIds = new Set(
              before.data.workflow_runs.map(run => run.id)
            );

            core.info(`Dispatching full ${workflowId} run on ${branch}`);
            await github.rest.actions.createWorkflowDispatch({
              ...common,
              workflow_id: workflowId,
              ref: branch,
              inputs: {
                full_run: 'true',
                models,
                board,
                engines,
                // TODO(after model/pi05_libero merges): add `pi05_first: 'true'` to run
                // the model round before the HW op tests with pi05 hoisted to the front,
                // for a ~2-minute pi05 verdict. It CANNOT be sent yet: this dispatch
                // targets ref 'main' (below), and GitHub validates workflow_dispatch
                // inputs against the workflow file ON THAT REF -- main's ci.yml has no
                // pi05_first input, so sending it 422s with "Unexpected inputs provided".
                // main's TESTS registry also has no pi05 entry for --first to hoist.
              },
            });

            let dispatchedRun;
            for (let attempt = 1; attempt <= 30; attempt++) {
              await sleep(2000);
              const runs = await github.rest.actions.listWorkflowRuns({
                ...common,
                workflow_id: workflowId,
                branch,
                event: 'workflow_dispatch',
                per_page: 20,
              });
              dispatchedRun = runs.data.workflow_runs.find(
                run => !existingIds.has(run.id)
              );
              if (dispatchedRun) {
                core.info(`Identified dispatched CI run ${dispatchedRun.id}`);
                break;
              }
              core.info(`Waiting for dispatched run to appear (${attempt}/30)`);
            }
            if (!dispatchedRun) {
              throw new Error('Could not identify the dispatched Model HW CI run');
            }

            let completedRun;
            while (true) {
              const response = await github.rest.actions.getWorkflowRun({
                ...common,
                run_id: dispatchedRun.id,
              });
              completedRun = response.data;
              core.info(
                `Model HW CI run ${completedRun.id}: ${completedRun.status}`
              );
              if (completedRun.status === 'completed') {
                break;
              }
              await sleep(60000);
            }

            const icon = completedRun.conclusion === 'success'
              ? ':white_check_mark:'
              : completedRun.conclusion === 'failure'
                ? ':x:'
                : ':warning:';
            const schedulerUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
              + `/actions/runs/${context.runId}`;
            const message = [
              `*Unified Engine Night Run: ${completedRun.conclusion === 'success' ? 'PASSED' : 'FAILED'}*`,
              '',
              `${icon} <${completedRun.html_url}|Full Model HW CI> — ${completedRun.conclusion}`,
              '',
              `Model scope: ${models || 'all registered models'} (one round, date-seeded shuffled order)`,
              `Boards: ${boardText}, engines: ${engines}`,
              `Branch: \`${branch}\``,
              `Commit: \`${completedRun.head_sha.slice(0, 12)}\``,
              `<${schedulerUrl}|View nightly scheduler run>`,
            ].join('\n');

            core.setOutput('slack-message', message);
            core.summary.addRaw(message).addEOL();

            // The model report of the dispatched run, so the nightly's own page shows
            // it too (ci.yml also puts it on its run page).
            try {
              const fs = require('fs');
              const { execSync } = require('child_process');
              const arts = await github.rest.actions.listWorkflowRunArtifacts({
                ...common, run_id: completedRun.id, per_page: 100,
              });
              const art = arts.data.artifacts.find(a => a.name === 'model-hw-ci-results');
              if (!art) throw new Error('no model-hw-ci-results artifact');
              const zip = await github.rest.actions.downloadArtifact({
                ...common, artifact_id: art.id, archive_format: 'zip',
              });
              const dir = `${process.env.RUNNER_TEMP}/model-hw-ci-results`;
              fs.mkdirSync(dir, { recursive: true });
              fs.writeFileSync(`${dir}.zip`, Buffer.from(zip.data));
              execSync(`unzip -o -q "${dir}.zip" -d "${dir}"`);
              const MAX = 200000;   // a step summary is capped at 1 MiB; two boards share it
              for (const [board, sub] of [['kintex7 (p620)', ''], ['Alveo U50 (p2 xdma0)', 'alveo_u50/']]) {
                const files = fs.existsSync(`${dir}/${sub}model_auto_test_results_pass1.txt`)
                  ? [['Pass 1: compile + run', 'model_auto_test_results_pass1.txt'],
                     ['Pass 2: run from bin, shuffled', 'model_auto_test_results_shuffle.txt']]
                  : [['model_auto_test_results.txt', 'model_auto_test_results.txt']];
                core.summary.addHeading(`model_auto_test.py: ${board}`, 2);
                let shown = 0;
                for (const [title, name] of files) {
                  if (!fs.existsSync(`${dir}/${sub}${name}`)) continue;
                  let text = fs.readFileSync(`${dir}/${sub}${name}`, 'utf8');
                  if (text.length > MAX) text = text.slice(0, MAX) + '\n... truncated: see the artifact';
                  core.summary.addHeading(title, 3).addCodeBlock(text, 'text');
                  shown++;
                }
                if (!shown) core.summary.addRaw(`\n_No ${board} report in the artifact; see the Full Model HW CI run._\n`);
              }
            } catch (error) {
              core.summary.addRaw(`\n_Model report not attached (${error.message}); see the Full Model HW CI run._\n`);
            }
            await core.summary.write();

            if (completedRun.conclusion !== 'success') {
              core.setFailed(
                `Full Model HW CI concluded with ${completedRun.conclusion}`
              );
            }

  notify-slack:
    name: Send result to Slack
    if: always()
    needs: run-model-ci
    runs-on: ubuntu-latest
    steps:
      - name: Post nightly result
        # Skip rather than fail the run while the Slack secrets are unset.
        if: ${{ env.SLACK_BOT_TOKEN != '' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: ${{ toJSON(needs.run-model-ci.outputs.slack-message || format('Unified Engine Night Run orchestration {0}. See {1}/{2}/actions/runs/{3}', needs.run-model-ci.result, github.server_url, github.repository, github.run_id)) }}
