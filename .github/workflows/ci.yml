name: Model HW CI

# Runs the local CI suite (run_ci.sh): generic hardware op tests, then the two
# Gemma4 E2B image cases by default. A manual full-run checkbox runs every
# registered model instead -- that registry is model_auto_test.py's TESTS list and
# includes pi05 (robot policy / VLA). The nightly (night-run.yml) dispatches this
# workflow with full_run: 'true', so pi05 is covered every night.
#
# pi05 note: its first run on a clean runner downloads the upstream checkpoint and
# exports ~13 GB into models/pi05/pi05_bin/weights_export/. That needs the jax /
# orbax / flax pins from models/pi05/pi05_requirements.txt to be present in the
# runner's env. The checkout step preserves models/, so this is a one-time cost.
# Models compile from scratch and run from their cached bins, with DRAM randomized
# (poisoned) before every single pass. Stops on first failure.
# Requires the FPGA device, so this must run on a self-hosted runner with the
# board attached.

on:
  workflow_dispatch:
    inputs:
      clean_bins:
        description: "Wipe cached compiled programs (programs.bin/json) first, forcing every model to recompile from scratch"
        required: false
        type: boolean
        default: false
      full_run:
        description: "Run the full model_auto_test.py registry instead of the two Gemma4 E2B image cases"
        required: false
        type: boolean
        default: false
      pi05_first:
        description: "Run the model round BEFORE user_hw_test.py, with pi05 hoisted to the front (fast pi05 verdict)"
        required: false
        type: boolean
        default: false
  push:
    # model/pi05_libero is here so the pi05 bring-up branch gets HW CI on every
    # push; the model subset it runs is branch-dependent (see "Run CI suite").
    branches: [main, model/pi05_libero]
  pull_request:
    branches: [main]

concurrency:
  group: model-hw-ci
  cancel-in-progress: false  # never cancel a run mid-flight on shared HW

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  hw-ci:
    # Skip the sync PRs opened by andromeda's pcie-build workflow: that workflow
    # already flashed this exact commit onto a board and ran the full suite green
    # before opening the PR, so re-running it here just occupies the shared board.
    # head_ref is empty outside pull_request events, so the push to main on merge
    # still runs normally.
    if: ${{ !startsWith(github.head_ref, 'sync_pcie_only_') }}
    runs-on: self-hosted
    # Leave the two-hour nightly scheduler five minutes to collect and report
    # this job's terminal result if the hardware suite reaches its time limit.
    timeout-minutes: 115
    steps:
      - name: Checkout
        # Do NOT let checkout run `git clean -ffdx`: its default wipe deletes the
        # untracked models/*/*_bin caches (model weights + HF snapshots), forcing
        # every model to re-fetch multi-GB weights every run. We clean the tree
        # ourselves below and preserve those caches.
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Clean workspace and program bins
        run: |
          # Restore tracked files, then wipe untracked cruft everywhere EXCEPT
          # models/ (keeps weights + HF cache). clean_program_bins.sh then removes
          # only the runtime-generated programs.bin/json inside models/*/*_bin.
          git reset --hard HEAD
          git clean -ffdx -e models
          ./clean_program_bins.sh

      - name: Prepare isolated Gemma4 environment
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          if [[ "${{ inputs.full_run }}" != "true" && "$BRANCH" == "model/pi05_libero" ]]; then
            echo "[ci] branch $BRANCH runs pi05 only; Gemma4 environment not needed"
            exit 0
          fi

          # pi05 intentionally uses Transformers 4.x, while Gemma4 requires the
          # Gemma4 model/processor support introduced in Transformers 5.5. Keep
          # both contracts intact by installing Gemma4 into its own per-job venv.
          # Never execute an interpreter persisted in the workspace: pull-request
          # jobs share this runner, while git clean deliberately preserves model
          # caches. The global pip download cache still makes this setup cheap.
          GEMMA4_VENV="$RUNNER_TEMP/ue-gemma4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          GEMMA4_REQUIREMENTS="$GITHUB_WORKSPACE/models/gemma4_requirements.txt"
          python -m venv --clear "$GEMMA4_VENV"

          # Reuse the runner's large shared packages (most importantly torch)
          # without inheriting its Transformers 4.x import. An explicit .pth is
          # reliable whether the runner's base interpreter comes from conda or
          # another venv; --system-site-packages is not reliable for nested venvs.
          GEMMA4_SITE=$("$GEMMA4_VENV/bin/python" -c \
            'import site; print(site.getsitepackages()[0])')
          python - <<'PY' > "$GEMMA4_SITE/ue-runner-site-packages.pth"
          import site
          print(*site.getsitepackages(), sep="\n")
          PY
          "$GEMMA4_VENV/bin/python" -m pip install \
            --disable-pip-version-check \
            --requirement "$GEMMA4_REQUIREMENTS"

          # Fail before reserving the FPGA if the cached environment is stale or
          # incomplete. torch is intentionally inherited from the base runner;
          # only the conflicting Hugging Face stack is isolated in this venv.
          "$GEMMA4_VENV/bin/python" - <<'PY'
          import os
          from pathlib import Path

          import torch
          import transformers
          from transformers import AutoModelForImageTextToText, AutoProcessor, AutoTokenizer

          expected = "5.5.4"
          if transformers.__version__ != expected:
              raise SystemExit(
                  f"Gemma4 CI requires transformers {expected}, "
                  f"found {transformers.__version__}"
              )
          print(
              f"Gemma4 environment ready: transformers={transformers.__version__}, "
              f"torch={torch.__version__}"
          )

          # Reproduce the formerly failing constructor against the cached
          # deploy tokenizer when it is available. A brand-new runner may not
          # have downloaded it yet, in which case the model build supplies it.
          model_dir = Path(os.environ["GITHUB_WORKSPACE"]) / "models/gemma4_e2b/gemma4_e2b_bin"
          tokenizer_dirs = [model_dir / "tokenizer", model_dir / "gemma-4-E2B-it"]
          tokenizer_dir = next(
              (path for path in tokenizer_dirs if (path / "tokenizer.json").is_file()),
              None,
          )
          if tokenizer_dir is None:
              print("Gemma4 tokenizer preflight deferred: no cached tokenizer yet")
          else:
              tokenizer = AutoTokenizer.from_pretrained(
                  tokenizer_dir, trust_remote_code=True, local_files_only=True
              )
              if tokenizer.image_token != "<|image|>" or tokenizer.audio_token != "<|audio|>":
                  raise SystemExit("Gemma4 tokenizer named-token contract is invalid")
              if "<|video|>" not in tokenizer.all_special_tokens:
                  raise SystemExit("Gemma4 <|video|> token is not marked special")
              print(f"Gemma4 tokenizer ready: {tokenizer_dir}")
          PY
          echo "GEMMA4_PYTHON=$GEMMA4_VENV/bin/python" >> "$GITHUB_ENV"

          python -m unittest -v test_model_auto_test_interpreter.py

      - name: Run CI suite
        id: ci
        run: |
          ARGS=()
          if [[ "${{ inputs.clean_bins }}" == "true" ]]; then
            ARGS+=(--clean-bins)
          fi
          # Must precede --only: run_ci.sh parses its flags positionally.
          if [[ "${{ inputs.pi05_first }}" == "true" ]]; then
            ARGS+=(--pi05-first)
          fi
          # Which branch is this? head_ref is set on pull_request, ref_name on push
          # and workflow_dispatch.
          BRANCH="${{ github.head_ref || github.ref_name }}"

          if [[ "${{ inputs.full_run }}" == "true" ]]; then
            : # no --only: the whole model_auto_test.py registry, pi05 first
          elif [[ "$BRANCH" == "model/pi05_libero" ]]; then
            # pi05 bring-up branch: run ONLY pi05. The Gemma4 cases add ~15 min of
            # shared-board time and cannot regress from pi05-only changes.
            echo "[ci] branch $BRANCH -> pi05 only"
            ARGS+=(--only pi05)
          else
            # Default subset elsewhere. --only filters but preserves registry order,
            # and pi05 is first in TESTS, so it runs before the Gemma4 cases; the
            # harness stops on the first failure, so a verdict lands in ~2 min.
            # The two Gemma4 cases stay in ONE model_auto_test.py invocation: the
            # first run creates/loads programs.bin; no clean or bin removal occurs
            # before the run-from-bin Vette case.
            ARGS+=(--only pi05 gemma4_e2b gemma4_e2b_run_from_bin)
          fi
          ./run_ci.sh "${ARGS[@]}"

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-hw-ci-results
          path: |
            model_auto_test_results.txt
            user_hw_test_summary.md
          if-no-files-found: warn

      - name: Comment CI results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const ws = process.env.GITHUB_WORKSPACE || '.';
            const ciOutcome = `${{ steps.ci.outcome }}`;
            const fullRun = `${{ inputs.full_run }}` === 'true';
            const MAX_MODEL_CHARS = 40000;
            const MAX_HW_CHARS = 15000;

            function readResult(name) {
              try {
                return fs.readFileSync(path.join(ws, name), 'utf8');
              } catch (error) {
                return `_${name} was not produced; see the workflow log._`;
              }
            }

            // Keep the head and the tail, drop the middle. Slicing off the head
            // loses the markdown table header + separator, and without them
            // GitHub renders the surviving rows as literal pipe-delimited text.
            // The head carries that header, the tail carries the verdict
            // (Status/RNG State for the HW summary, "Overall: N/M passed" for
            // the model run). Only the intermediate rows are expendable.
            function clipMiddle(text, maxChars) {
              if (text.length <= maxChars) return text;
              const lines = text.split('\n');

              // A leading "| ... |" + "| --- |" pair means the file opens with a
              // table; re-emit those two lines above the tail so the surviving
              // tail rows still render as a table rather than as literal pipes.
              const hasTable =
                lines.length > 1
                && lines[0].startsWith('|')
                && /^\|[\s|:-]+\|$/.test(lines[1]);
              const tableHead = hasTable ? lines.slice(0, 2) : [];

              // Assumes maxChars >> NOTE_RESERVE; both callers pass >= 15000.
              const NOTE_RESERVE = 400;  // elision note + re-emitted table header
              const budget = Math.max(maxChars - NOTE_RESERVE, 0);
              const headBudget = Math.floor(budget * 0.55);

              const head = [];
              let used = 0;
              for (const line of lines) {
                if (used + line.length + 1 > headBudget) break;
                head.push(line);
                used += line.length + 1;
              }

              const tail = [];
              used = 0;
              for (let i = lines.length - 1; i >= head.length; i--) {
                if (used + lines[i].length + 1 > budget - headBudget) break;
                tail.unshift(lines[i]);
                used += lines[i].length + 1;
              }

              const omitted = lines.length - head.length - tail.length;
              if (omitted <= 0) return text;

              const bridge = [
                '',
                `_… ${omitted} intermediate line(s) omitted; the full file is in the model-hw-ci-results artifact …_`,
                '',
              ];
              // Only re-open the table if the tail actually resumes mid-table.
              if (tail.length > 0 && tail[0].startsWith('|')) {
                bridge.push(...tableHead);
              }
              return [...head, ...bridge, ...tail].join('\n');
            }

            const modelResults = clipMiddle(
              readResult('model_auto_test_results.txt'), MAX_MODEL_CHARS);
            const hwResults = clipMiddle(
              readResult('user_hw_test_summary.md'), MAX_HW_CHARS);

            const status = ciOutcome === 'success'
              ? '✅ PASSED'
              : ciOutcome === 'failure'
                ? '❌ FAILED'
                : `⚠️ ${ciOutcome.toUpperCase()}`;
            const modelScope = fullRun
              ? 'all registered models'
              : 'gemma4_e2b + gemma4_e2b_run_from_bin';
            const comment = [
              '**Unified Engine HW CI Report**',
              `- **Status:** ${status}`,
              `- **Commit:** \`${{ github.sha }}\``,
              `- **Run ID:** \`${{ github.run_id }}\``,
              `- **Model scope:** ${modelScope}`,
              '',
              '**Generic HW Test Summary:**',
              '',
              hwResults,
              '',
              '**Model Test Results:**',
              '',
              modelResults,
              '',
              `[View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            async function postComment(issueNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment,
              });
              console.log(`Comment posted to PR #${issueNumber}`);
            }

            try {
              if (context.payload.pull_request) {
                await postComment(context.payload.pull_request.number);
                return;
              }

              if (context.eventName === 'push' || context.eventName === 'workflow_dispatch') {
                const branchName = context.ref.replace('refs/heads/', '');
                if (branchName === 'main' || branchName === 'master') {
                  console.log('Run is on the main branch; no PR comment needed.');
                  return;
                }
                const { data: prs } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  head: `${context.repo.owner}:${branchName}`,
                });
                if (prs.length > 0) {
                  await postComment(prs[0].number);
                } else {
                  console.log(`No open PR found for branch ${branchName}.`);
                }
              }
            } catch (error) {
              console.log(`Unable to post PR comment: ${error.message}`);
            }
