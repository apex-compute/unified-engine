name: Model HW CI

# Runs the local CI suite (run_ci.sh): generic hardware op tests, then the two
# Gemma4 E2B image cases by default. A manual full-run checkbox runs every
# registered model instead -- that registry is model_auto_test.py's TESTS list and
# includes pi05 (robot policy / VLA). The nightly (night-run.yml) dispatches this
# workflow with full_run: 'true', so pi05 is covered every night.
#
# alpamayo2_edge note: registered in TESTS, so the nightly full run covers it. It needs
# the 8-engine / 8 GiB board and the nvidia/Alpamayo2-Edge checkpoint in the runner's
# Hugging Face cache (downloaded on first run); each pass is a full compile + ~80 s.
#
# pi05 note: its first run on a clean runner downloads the upstream checkpoint and
# exports ~13 GB into models/pi05/pi05_bin/weights_export/. That needs the jax /
# orbax / flax pins from models/pi05/pi05_requirements.txt to be present in the
# runner's env. The checkout step preserves models/, so this is a one-time cost.
# Models compile from scratch and run from their cached bins, with DRAM randomized
# (poisoned) before every single pass. Stops on first failure.
# Requires the FPGA device, so this must run on a self-hosted runner with the
# board attached.

on:
  workflow_dispatch:
    inputs:
      full_run:
        description: "Run the full model_auto_test.py registry instead of the two Gemma4 E2B image cases"
        required: false
        type: boolean
        default: false
      models:
        description: "Registered model names, space-separated (model_auto_test.py --list-names); overrides full_run. Empty: full_run / the default subset"
        required: false
        type: string
        default: ""
      board:
        description: "kintex7 (p620), alveo_u50 (p2 xdma0, over SSH) or both (the nightly)"
        required: false
        type: choice
        options: [kintex7, alveo_u50, both]
        default: kintex7
      engines:
        description: "Model round engine count: max (every core the board reports) or 1..8; above the board's cores is an error. user_hw_test.py is not affected"
        required: false
        type: string
        default: "max"
      pi05_first:
        description: "Run the model round BEFORE user_hw_test.py, with pi05 hoisted to the front (fast pi05 verdict)"
        required: false
        type: boolean
        default: false
  push:
    # model/pi05_libero and model/verapulse are here so the two VLA bring-up
    # branches get HW CI on every push; the model subset each runs is
    # branch-dependent (see "Run CI suite").
    branches: [main, model/pi05_libero, model/verapulse]
  pull_request:
    branches: [main]

concurrency:
  group: model-hw-ci
  cancel-in-progress: false  # never cancel a run mid-flight on shared HW

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  hw-ci:
    # Skip the sync PRs opened by andromeda's pcie-build workflow: that workflow
    # already flashed this exact commit onto a board and ran the full suite green
    # before opening the PR, so re-running it here just occupies the shared board.
    # head_ref is empty outside pull_request events, so the push to main on merge
    # still runs normally.
    if: ${{ !startsWith(github.head_ref, 'sync_pcie_only_') }}
    runs-on: self-hosted
    # Leave the nightly scheduler (310 min) ten minutes to collect and report this
    # job's terminal result if the hardware suite reaches its time limit. The kintex7
    # suite takes ~2 h; the Alveo U50 leg runs alongside it.
    timeout-minutes: 300
    steps:
      - name: Checkout
        # Do NOT let checkout run `git clean -ffdx`: its default wipe deletes the
        # untracked models/*/*_bin caches (model weights + HF snapshots), forcing
        # every model to re-fetch multi-GB weights every run. We clean the tree
        # ourselves below and preserve those caches.
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Clean workspace
        run: |
          # Restore tracked files, then wipe untracked cruft everywhere EXCEPT
          # models/ (keeps weights + HF cache). Program images need no cleaning:
          # every model recompiles its program unless run with --run-from-bin.
          git reset --hard HEAD
          git clean -ffdx -e models

      - name: Resolve run config
        # One set of run_ci.sh args for both boards. push / pull_request carry no
        # inputs: kintex7, every core, the branch's default model subset.
        id: cfg
        env:
          IN_BOARD: ${{ inputs.board || 'kintex7' }}
          IN_ENGINES: ${{ inputs.engines || 'max' }}
          IN_MODELS: ${{ inputs.models }}
          IN_FULL: ${{ inputs.full_run }}
          IN_PI05_FIRST: ${{ inputs.pi05_first }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$IN_BOARD" in
            kintex7|alveo_u50|both) ;;
            *) echo "::error::board must be kintex7, alveo_u50 or both (got '$IN_BOARD')"; exit 1 ;;
          esac
          if [[ "$IN_ENGINES" != max && ! "$IN_ENGINES" =~ ^[1-8]$ ]]; then
            echo "::error::engines must be max or 1..8 (got '$IN_ENGINES')"; exit 1
          fi
          read -r -a MODELS <<< "$IN_MODELS"
          for m in "${MODELS[@]}"; do
            [[ "$m" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "::error::bad model name '$m'"; exit 1; }
          done

          ARGS=(--engines "$IN_ENGINES")
          # Must precede --only: run_ci.sh takes the rest of the line as names.
          [[ "$IN_PI05_FIRST" == "true" ]] && ARGS+=(--pi05-first)
          if [[ ${#MODELS[@]} -gt 0 ]]; then
            # A chosen list: shuffled like the full run, every listed model runs.
            ARGS+=(--shuffle --only "${MODELS[@]}")
            SCOPE="${MODELS[*]}"
          elif [[ "$IN_FULL" == "true" ]]; then
            # No --only: the whole model_auto_test.py registry, one round, in a
            # date-seeded shuffled order so each night covers different
            # (previous -> model) pairs for cross-model NaN / contamination.
            ARGS+=(--shuffle)
            SCOPE="all registered models"
          elif [[ "$BRANCH" == "model/verapulse" ]]; then
            # verapulse bring-up branch: run ONLY verapulse. Same reasoning as pi05
            # below -- the Gemma4 cases add ~15 min of shared-board time and cannot
            # regress from changes confined to models/verapulse.
            ARGS+=(--only verapulse); SCOPE="verapulse"
          elif [[ "$BRANCH" == "alpamayo2-edge" ]]; then
            # Alpamayo 2 Edge bring-up branch: run ONLY alpamayo2_edge (8 engines, 8 GiB;
            # the harness skips it on a smaller board).
            ARGS+=(--only alpamayo2_edge); SCOPE="alpamayo2_edge"
          elif [[ "$BRANCH" == "model/pi05_libero" ]]; then
            # pi05 bring-up branch: run ONLY pi05.
            ARGS+=(--only pi05); SCOPE="pi05"
          else
            # Default subset elsewhere. --only filters but preserves registry order,
            # and pi05 is first in TESTS, so it runs before the Gemma4 cases; the
            # harness stops on the first failure, so a verdict lands in ~2 min.
            # The two Gemma4 cases stay in ONE model_auto_test.py invocation, so the
            # run-from-bin Vette case replays the image the first case just compiled.
            ARGS+=(--only pi05 gemma4_e2b gemma4_e2b_run_from_bin)
            SCOPE="pi05 + gemma4_e2b + gemma4_e2b_run_from_bin"
          fi

          KINTEX7=false; ALVEO=false
          [[ "$IN_BOARD" != alveo_u50 ]] && KINTEX7=true
          [[ "$IN_BOARD" != kintex7 ]] && ALVEO=true
          echo "[ci] board=$IN_BOARD engines=$IN_ENGINES scope: $SCOPE"
          echo "[ci] ./run_ci.sh ${ARGS[*]}"
          {
            echo "kintex7=$KINTEX7"
            echo "alveo_u50=$ALVEO"
            echo "args=${ARGS[*]}"
            echo "scope=$SCOPE (board $IN_BOARD, engines $IN_ENGINES)"
          } >> "$GITHUB_OUTPUT"

      - name: Start the Alveo U50 leg on p2
        # The same suite on p2's U50 (xdma0), run by github@p2 over SSH from this
        # runner (one runner on p620, so a second job would wait ~2 h for this one).
        # It runs in the background while this runner tests the kintex7 below; the
        # "Collect" step waits for it. See .github/scripts/alveo_u50_remote.sh.
        # Never fails itself: a failure is written to alveo_u50/rc for Collect.
        if: ${{ steps.cfg.outputs.alveo_u50 == 'true' }}
        env:
          P2_SSH: ${{ vars.UE_ALVEO_SSH || 'github@192.168.1.132' }}
          # Validated tokens (Resolve run config), so the remote shell may split them.
          RUN_ARGS: ${{ steps.cfg.outputs.args }}
        run: |
          mkdir -p alveo_u50
          if ! ssh -o BatchMode=yes -o ConnectTimeout=15 "$P2_SSH" true; then
            echo "::error::cannot ssh to $P2_SSH as $(whoami)@$(hostname); the Alveo U50 leg is not run"
            echo 255 > alveo_u50/rc
            exit 0
          fi
          nohup bash -c 'ssh -o BatchMode=yes -o ServerAliveInterval=60 "$0" "bash -s -- $1" \
                           < .github/scripts/alveo_u50_remote.sh > alveo_u50/run.log 2>&1
                         echo $? > alveo_u50/rc' "$P2_SSH" "$GITHUB_SHA $RUN_ARGS" > /dev/null 2>&1 &
          echo "Alveo U50 leg started on $P2_SSH for $GITHUB_SHA: run_ci.sh $RUN_ARGS (pid $!)"

      - name: Run CI suite
        id: ci
        if: ${{ steps.cfg.outputs.kintex7 == 'true' }}
        env:
          RUN_ARGS: ${{ steps.cfg.outputs.args }}
        run: |
          read -r -a ARGS <<< "$RUN_ARGS"
          ./run_ci.sh "${ARGS[@]}"

      - name: Collect the Alveo U50 leg
        if: ${{ always() && steps.cfg.outputs.alveo_u50 == 'true' }}
        env:
          P2_SSH: ${{ vars.UE_ALVEO_SSH || 'github@192.168.1.132' }}
        run: |
          while [ ! -f alveo_u50/rc ]; do sleep 30; done
          RC=$(cat alveo_u50/rc)
          if [ "$RC" != 255 ]; then
            scp -q -o BatchMode=yes "$P2_SSH:ue_ci_alveo_u50/*" alveo_u50/ || echo "::warning::no result files copied from $P2_SSH"
          fi
          echo "--- tail of the Alveo U50 leg (full log: alveo_u50/run.log in the artifact)"
          tail -n 60 alveo_u50/run.log 2>/dev/null || true
          if [ "$RC" != 0 ]; then
            echo "::error::Alveo U50 leg failed (exit $RC)"
            exit 1
          fi

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-hw-ci-results
          path: |
            model_auto_test_results.txt
            model_auto_test_results_pass1.txt
            model_auto_test_results_shuffle.txt
            user_hw_test_summary.md
            alveo_u50/
          if-no-files-found: warn

      - name: Publish results to the job summary
        # Shows model_auto_test_results.txt on the run page itself (the Summary
        # tab), not only in the artifact or a PR comment. A full run shows both
        # passes; user_hw_test_summary.md goes in a collapsed block below.
        if: always()
        run: |
          MAX=400000   # bytes per file: GitHub caps a step summary at 1 MiB
          show() {     # show TITLE FILE
            [ -f "$2" ] || return 0
            echo "### $1"
            echo
            echo '```text'
            head -c "$MAX" "$2"
            [ "$(wc -c < "$2")" -gt "$MAX" ] && echo "... truncated: the full file is in the model-hw-ci-results artifact"
            echo '```'
            echo
          }
          {
            echo "## Unified Engine HW CI: model_auto_test.py"
            echo
            if [ -f model_auto_test_results_pass1.txt ]; then
              show "Pass 1: compile + run" model_auto_test_results_pass1.txt
              show "Pass 2: run from bin, shuffled" model_auto_test_results_shuffle.txt
            elif [ -f model_auto_test_results.txt ]; then
              show "model_auto_test_results.txt" model_auto_test_results.txt
            else
              echo "_model_auto_test_results.txt was not produced; see the job log._"
              echo
            fi
            if [ -f user_hw_test_summary.md ]; then
              echo "<details><summary>user_hw_test.py summary</summary>"
              echo
              head -c "$MAX" user_hw_test_summary.md
              echo
              echo "</details>"
            fi
            if [ -d alveo_u50 ]; then
              echo
              echo "## Alveo U50 (p2 xdma0): model_auto_test.py"
              echo
              if [ -f alveo_u50/model_auto_test_results_pass1.txt ]; then
                show "Pass 1: compile + run" alveo_u50/model_auto_test_results_pass1.txt
                show "Pass 2: run from bin, shuffled" alveo_u50/model_auto_test_results_shuffle.txt
              elif [ -f alveo_u50/model_auto_test_results.txt ]; then
                show "model_auto_test_results.txt" alveo_u50/model_auto_test_results.txt
              else
                echo "_No results from the Alveo U50 leg; see alveo_u50/run.log in the artifact._"
                echo
              fi
              if [ -f alveo_u50/user_hw_test_summary.md ]; then
                echo "<details><summary>user_hw_test.py summary (Alveo U50)</summary>"
                echo
                head -c "$MAX" alveo_u50/user_hw_test_summary.md
                echo
                echo "</details>"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment CI results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const ws = process.env.GITHUB_WORKSPACE || '.';
            // The whole job, so an Alveo U50 failure (or an alveo_u50-only run,
            // where the kintex7 step is skipped) is reflected too.
            const ciOutcome = `${{ job.status }}`;
            const MAX_MODEL_CHARS = 40000;
            const MAX_HW_CHARS = 15000;

            function readResult(name) {
              try {
                return fs.readFileSync(path.join(ws, name), 'utf8');
              } catch (error) {
                return `_${name} was not produced; see the workflow log._`;
              }
            }

            // Keep the head and the tail, drop the middle. Slicing off the head
            // loses the markdown table header + separator, and without them
            // GitHub renders the surviving rows as literal pipe-delimited text.
            // The head carries that header, the tail carries the verdict
            // (Status/RNG State for the HW summary, "Overall: N/M passed" for
            // the model run). Only the intermediate rows are expendable.
            function clipMiddle(text, maxChars) {
              if (text.length <= maxChars) return text;
              const lines = text.split('\n');

              // A leading "| ... |" + "| --- |" pair means the file opens with a
              // table; re-emit those two lines above the tail so the surviving
              // tail rows still render as a table rather than as literal pipes.
              const hasTable =
                lines.length > 1
                && lines[0].startsWith('|')
                && /^\|[\s|:-]+\|$/.test(lines[1]);
              const tableHead = hasTable ? lines.slice(0, 2) : [];

              // Assumes maxChars >> NOTE_RESERVE; both callers pass >= 15000.
              const NOTE_RESERVE = 400;  // elision note + re-emitted table header
              const budget = Math.max(maxChars - NOTE_RESERVE, 0);
              const headBudget = Math.floor(budget * 0.55);

              const head = [];
              let used = 0;
              for (const line of lines) {
                if (used + line.length + 1 > headBudget) break;
                head.push(line);
                used += line.length + 1;
              }

              const tail = [];
              used = 0;
              for (let i = lines.length - 1; i >= head.length; i--) {
                if (used + lines[i].length + 1 > budget - headBudget) break;
                tail.unshift(lines[i]);
                used += lines[i].length + 1;
              }

              const omitted = lines.length - head.length - tail.length;
              if (omitted <= 0) return text;

              const bridge = [
                '',
                `_… ${omitted} intermediate line(s) omitted; the full file is in the model-hw-ci-results artifact …_`,
                '',
              ];
              // Only re-open the table if the tail actually resumes mid-table.
              if (tail.length > 0 && tail[0].startsWith('|')) {
                bridge.push(...tableHead);
              }
              return [...head, ...bridge, ...tail].join('\n');
            }

            // An alveo_u50-only run has no kintex7 results; report the U50 leg's.
            const dir = `${{ steps.cfg.outputs.kintex7 }}` === 'false' ? 'alveo_u50/' : '';
            const modelResults = clipMiddle(
              readResult(`${dir}model_auto_test_results.txt`), MAX_MODEL_CHARS);
            const hwResults = clipMiddle(
              readResult(`${dir}user_hw_test_summary.md`), MAX_HW_CHARS);

            const status = ciOutcome === 'success'
              ? '✅ PASSED'
              : ciOutcome === 'failure'
                ? '❌ FAILED'
                : `⚠️ ${ciOutcome.toUpperCase()}`;
            const modelScope = `${{ steps.cfg.outputs.scope }}`;
            const comment = [
              '**Unified Engine HW CI Report**',
              `- **Status:** ${status}`,
              `- **Commit:** \`${{ github.sha }}\``,
              `- **Run ID:** \`${{ github.run_id }}\``,
              `- **Model scope:** ${modelScope}`,
              '',
              '**Generic HW Test Summary:**',
              '',
              hwResults,
              '',
              '**Model Test Results:**',
              '',
              modelResults,
              '',
              `[View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            async function postComment(issueNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment,
              });
              console.log(`Comment posted to PR #${issueNumber}`);
            }

            try {
              if (context.payload.pull_request) {
                await postComment(context.payload.pull_request.number);
                return;
              }

              if (context.eventName === 'push' || context.eventName === 'workflow_dispatch') {
                const branchName = context.ref.replace('refs/heads/', '');
                if (branchName === 'main' || branchName === 'master') {
                  console.log('Run is on the main branch; no PR comment needed.');
                  return;
                }
                const { data: prs } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  head: `${context.repo.owner}:${branchName}`,
                });
                if (prs.length > 0) {
                  await postComment(prs[0].number);
                } else {
                  console.log(`No open PR found for branch ${branchName}.`);
                }
              }
            } catch (error) {
              console.log(`Unable to post PR comment: ${error.message}`);
            }
