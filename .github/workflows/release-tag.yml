name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (example: v1.2.3)"
        required: true
        type: string
      message:
        description: "Annotated tag message (optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and create tag
        id: create_tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          set -euo pipefail

          tag="$(echo "$INPUT_TAG" | xargs)"
          msg="$INPUT_MESSAGE"

          if [ -z "$tag" ]; then
            echo "::error::tag input cannot be empty."
            exit 1
          fi

          # Conservative validation: allow common release-tag characters.
          if ! [[ "$tag" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid tag '$tag'. Allowed: letters, numbers, dot, underscore, dash, slash."
            exit 1
          fi

          git fetch --tags origin main

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag '$tag' already exists locally."
            exit 1
          fi

          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "::error::Tag '$tag' already exists on origin."
            exit 1
          fi

          target_sha="$(git rev-parse "origin/main^{commit}")"
          echo "Resolved fixed ref 'main' to commit $target_sha"

          if [ -n "$(echo "$msg" | xargs)" ]; then
            git tag -a "$tag" "$target_sha" -m "$msg"
          else
            git tag -a "$tag" "$target_sha" -m "Release $tag"
          fi

          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

          {
            echo "### Release tag created"
            echo "- Tag: \`$tag\`"
            echo "- Ref: \`main\`"
            echo "- Commit: \`$target_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect local .bin file
        id: collect_bin
        run: |
          set -euo pipefail
          mkdir -p release_artifacts

          git fetch --no-tags origin main
          mapfile -t bins < <(git ls-tree -r --name-only origin/main -- '*.bin')
          if [ "${#bins[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 tracked .bin file on origin/main, found ${#bins[@]}."
            echo "Tracked .bin files on origin/main:"
            git ls-tree -r --name-only origin/main -- '*.bin' || true
            exit 1
          fi

          source_bin="${bins[0]}"
          out_bin="release_artifacts/$(basename "$source_bin")"
          git show "origin/main:${source_bin}" > "$out_bin"
          echo "source_bin=$source_bin" >> "$GITHUB_OUTPUT"
          echo "source_ref=origin/main" >> "$GITHUB_OUTPUT"

      - name: Upload .bin to destination release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          DEST_REPO: ${{ secrets.RELEASE_REPO }}
          TAG_NAME: ${{ steps.create_tag.outputs.tag }}
          TAG_SHA: ${{ steps.create_tag.outputs.sha }}
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
          SOURCE_BIN: ${{ steps.collect_bin.outputs.source_bin }}
          SOURCE_REF: ${{ steps.collect_bin.outputs.source_ref }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing required release token secret."
            exit 1
          fi
          if [ -z "${DEST_REPO:-}" ]; then
            echo "::error::Missing required destination repo secret (format: owner/repo)."
            exit 1
          fi

          if gh release view "$TAG_NAME" -R "$DEST_REPO" >/dev/null 2>&1; then
            echo "Release for $TAG_NAME already exists in destination repo; reusing."
          else
            notes="Release $TAG_NAME"
            if [ -n "$(echo "$INPUT_MESSAGE" | xargs)" ]; then
              notes="$INPUT_MESSAGE"
            fi
            gh release create "$TAG_NAME" -R "$DEST_REPO" --title "$TAG_NAME" --notes "$notes"
          fi

          mapfile -t bins < <(rg --files release_artifacts -g "*.bin")
          if [ "${#bins[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 .bin file, found ${#bins[@]}."
            exit 1
          fi

          fpga_hash="${TAG_SHA:0:8}"
          if [ -z "$fpga_hash" ]; then
            echo "::error::Could not derive hash from tag commit."
            exit 1
          fi

          renamed_bin="release_artifacts/update_${fpga_hash}.bin"
          cp "${bins[0]}" "$renamed_bin"
          gh release upload "$TAG_NAME" "$renamed_bin" -R "$DEST_REPO" --clobber

          {
            echo ""
            echo "### Release assets uploaded"
            echo "- Release tag: \`$TAG_NAME\`"
            echo "- Commit: \`$TAG_SHA\`"
            echo "- Source ref for .bin: \`$SOURCE_REF\`"
            echo "- Source local .bin: \`$SOURCE_BIN\`"
            echo "- FPGA hash for asset naming: \`$fpga_hash\`"
            echo "- Uploaded renamed .bin file: \`$(basename "$renamed_bin")\`"
          } >> "$GITHUB_STEP_SUMMARY"
